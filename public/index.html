<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consent-Based Location Share</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Consent-Based Location Share</h1>
    <p>This demo only collects location after explicit consent. Tap the button below to share your location with the server.</p>
    <div class="controls">
      <button id="shareButton">Share my location</button>
    </div>
    <div id="status" class="status">Waiting for user action...</div>
    <div id="dashboardLinkContainer" class="dashboard-link hidden">
      <a id="dashboardLink" href="#" target="_blank">Open your dashboard</a>
    </div>
    <div class="links">
      <a href="dashboard.html">View dashboard</a>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
